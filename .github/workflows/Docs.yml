name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - ns/devibe
    tags: '*'
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Push builds always run to completion and the queue collapses onto the
  # tip: GitHub keeps at most one `pending` run per group (default
  # `queue: single`) and cancels any older pending run when a newer one
  # arrives — so the running build finishes and only the newest queued
  # build runs next. Only PR previews cancel in progress. A genuinely
  # wedged run is bounded by the build job's `timeout-minutes` instead of
  # by cancellation (which is what the old comment above was written for).
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    if: github.repository == 'nsiccha/BayesianRegressionModels.jl'
    runs-on: ubuntu-latest
    # Bound a wedged docs build well under GitHub's default six-hour timeout.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private repos
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        # make.jl uses the split-build form (`build_vitepress=false` plus
        # an explicit `DocumenterVitepress.build_docs`), which shells out
        # to `npm run env -- vitepress build …` — vitepress must be
        # installed via npm before the Julia build runs (see /ci §6g).
        run: cd docs && npm install
      - name: Install dependencies
        env:
          # Pkg's automatic whole-environment precompile can retain a Julia
          # worker indefinitely on this closure. The docs build below loads
          # and precompiles the packages it actually consumes.
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        # BRM's nsiccha-org runtime dependencies must be developed explicitly:
        # Julia 1.10 ignores Project.toml's `[sources]`, and MutatingFunctions
        # plus OutputSignatures are not registered. Clone the public sources
        # and Pkg.develop the whole closure in one batch (see /ci §5).
        # HTMXObjects is private and not needed by the docs build — see
        # make.jl's conditional theme install.
        #
        # `devibe`, NOT `dev`. StanBlocks' active line moved to `devibe`
        # and `dev` is now a strict ancestor 303 commits behind it
        # (`git rev-list --left-right --count origin/dev...origin/devibe`
        # → `0 303`). BRM's HEAD uses macros that only exist on `devibe`,
        # so `-b dev` fails at `using BayesianRegressionModels` with e.g.
        # `UndefVarError: @stanonly not defined` — the first run on
        # nsiccha/BayesianRegressionModels.jl died exactly there
        # (run 30708357301).
        run: |
          git clone -b devibe https://github.com/nsiccha/StanBlocks.jl.git
          git clone https://github.com/nsiccha/MutatingFunctions.jl.git
          git clone https://github.com/nsiccha/OutputSignatures.jl.git
          julia --project=docs -e 'using Pkg; Pkg.develop([
            PackageSpec(path=pwd()),
            PackageSpec(path="StanBlocks.jl"),
            PackageSpec(path="MutatingFunctions.jl"),
            PackageSpec(path="OutputSignatures.jl"),
          ]); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
