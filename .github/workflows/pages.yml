name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main, ns/more_models]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write        # let julia-actions/cache evict its own caches

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      - uses: julia-actions/cache@v2

      - name: Instantiate render environment
        run: julia --project=scripts/render_env -e 'import Pkg; Pkg.instantiate()'

      - name: Render catalog
        run: julia --project=scripts/render_env scripts/render_catalog.jl

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
